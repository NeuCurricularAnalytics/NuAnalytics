# =============================================================================
# DEGREE REQUIREMENTS SCHEMA v5.2
# =============================================================================
#
# Design Principles:
#   - Minimal types: 3 requirement types cover all cases
#   - Computable credits: derived from courses, not redundantly specified
#   - Structured prerequisites: boolean expressions, not prose
#   - Inline syntax for common patterns: bundles, equivalents, ranges
#
# Changes from v5.1:
#   - BREAKING: `from` block now supports combining `courses` AND `pattern`
#     Previously these were mutually exclusive; now they can be used together
#     to create a pool of "specific courses + pattern-matched courses"
#   - Added `include` as array of patterns (multiple pattern support)
#   - Clarified that `exclude` applies to pattern matches, not explicit courses
#   - Added examples for combined courses+pattern usage
#
# Changes from v5.0 (included in v5.1):
#   - Added cross_listed_as for equivalent courses across departments
#   - Added repeatable and max_repeat_credits for research/directed study
#   - Added credit_range for variable-credit requirements
#   - Expanded constraints with min_upper_division, max_from_subject
#   - Added gen_ed_attributes for mapping courses to university requirements
#   - Clarified grade requirements: course-level vs prerequisite expressions
#   - Added external_requirement flag for minor/second major paths
#   - Improved pattern exclusion syntax documentation
#
# =============================================================================

# =============================================================================
# QUICKSTART
# =============================================================================
#
# A complete, valid degree YAML in ~60 lines. Copy this and modify.
# For full reference, request section="all" or one of the dedicated
# sections: degree, requirements, courses, examples.

# degree:
#   id: example-bs-cs-2024
#   institution: Example University
#   program: B.S. Computer Science
#   catalog_year: "2024-2025"
#   total_credits: 120
#   gpa_minimum: 2.0
#   major_subjects: ["CS", "MATH"]
#   allow_double_counting: false
#
# requirements:
#
#   # type: all — every listed course must be completed
#   intro_sequence:
#     name: Introductory CS
#     type: all
#     category: major
#     courses: [CS1, CS2]
#
#   # type: select — choose N courses (or N credits) from a pool
#   cs_electives:
#     name: Upper-division CS electives
#     type: select
#     category: major
#     count: 3
#     from:
#       pattern: "CS:3000+"           # match all CS courses numbered 3000+
#       exclude: [CS5000]              # optional — exclude specific matches
#
#   # type: select with explicit course list
#   quant_reasoning:
#     name: Quantitative reasoning
#     type: select
#     category: gen_ed
#     count: 1
#     from:
#       courses: [MATH1, STAT1]
#
#   # type: one_of with nested select requirements — model
#   # "(intro pair A or intro pair B) + (data structures pair X or pair Y)"
#   # i.e. pick one course from EACH of two pools as a single mutually
#   # exclusive group. Each option's `requirements` block can hold any
#   # mix of `all` and `select` requirements; the option is satisfied
#   # only when all of them are.
#   intro_track:
#     name: Introductory track
#     type: one_of
#     category: major
#     options:
#       - id: track_a
#         name: Track A (CS1 + CS2)
#         requirements:
#           - name: Intro pair
#             type: select
#             count: 1
#             from:
#               courses: [CS1, CS1_HONORS]
#           - name: Data structures pair
#             type: select
#             count: 1
#             from:
#               courses: [CS2, CS2_FAST]
#       - id: track_b
#         name: Track B (alt sequence)
#         requirements:
#           - name: Alt intro
#             type: all
#             courses: [CS1_ALT, CS2_ALT]
#
# courses:
#
#   CS1:
#     title: Introduction to Computing
#     prefix: CS
#     number: "1100"
#     credits: 4
#
#   CS2:
#     title: Data Structures
#     prefix: CS
#     number: "2100"
#     credits: 4
#     prerequisites_raw: "CS1"        # boolean expression: course IDs joined by & |
#
#   MATH1:
#     title: Calculus I
#     prefix: MATH
#     number: "1100"
#     credits: 4
#
#   STAT1:
#     title: Probability and Statistics
#     prefix: STAT
#     number: "2100"
#     credits: 3

# =============================================================================
# DEGREE METADATA
# =============================================================================

degree:
  id: string                          # Unique identifier, e.g., "uhm-ics-bscs-general"
  institution: string
  program: string                     # Full degree name including track
  catalog_year: string                # e.g., "2024-2025"
  source_url: string | null

  # Credit requirements
  total_credits: integer              # Minimum required for graduation
  upper_division_credits: integer | null  # Minimum 300+ level credits (null if not specified)
  in_major_credits: integer | null    # Minimum credits within major subjects

  # GPA requirements
  gpa_minimum: number                 # Overall GPA required
  gpa_major: number | null            # Major GPA if different

  # Grade requirements
  grade_minimum: "string | null"        # Default minimum grade for major courses (e.g., "C")
  grade_minimum_note: "string | null"   # Clarification (e.g., "C means C, not C-")

  # Subjects that count toward major
  major_subjects: "[string] | null"     # e.g., ["CS", "CY", "DS", "IS"]
  # Used by audit_degree to:
  #   1. Restrict deep prerequisite-chain analysis to courses whose subject
  #      prefix appears here (avoids flagging external supporting courses).
  #   2. Classify missing-prereq findings as internal_missing_prereq when the
  #      course's prefix is in this list, vs external_missing_prereq otherwise.
  # Match is case-insensitive against the alphabetic prefix of each course key
  # (e.g. "CS" matches "CS3000", "Cs3000", "cs3000"). Leave null when you don't
  # want subject-based scoping; audit then falls back to "course is in scope iff
  # it appears in some requirement", and missing-prereq tags become
  # unknown_scope.

  # Double counting policy
  allow_double_counting: boolean      # Can courses satisfy multiple requirements?

# =============================================================================
# REQUIREMENTS
# =============================================================================
#
# Three requirement types:
#
# | Type     | Use Case                              | Key Fields           |
# |----------|---------------------------------------|----------------------|
# | all      | Must complete all listed courses      | courses              |
# | select   | Choose N courses/credits from options | from, count/credits  |
# | one_of   | Choose one path (mutually exclusive)  | options              |
#
# =============================================================================

requirements:

  requirement_id:                     # Unique key for this requirement
    name: string                      # Human-readable name
    type: all | select | one_of
    category: major | supporting | gen_ed | elective

    # -------------------------------------------------------------------------
    # For type: all - Complete all listed courses
    # -------------------------------------------------------------------------
    courses: [course_ref]             # Required when type is 'all'

    # -------------------------------------------------------------------------
    # For type: select - Choose from options
    # -------------------------------------------------------------------------
    from:                             # Source of course options
      # ----- Course Sources (can combine A, B, and/or C) -----

      # Option A: Explicit course list
      courses: [course_ref]           # Specific courses always included in pool

      # Option B: Pattern-based (single pattern - legacy support)
      pattern: string                 # e.g., "CS:400+"

      # Option C: Multiple patterns (NEW in v5.2)
      include: [string]               # Array of patterns, e.g., ["CS:300-479", "MATH:300-479"]

      # Exclusions (apply to pattern/include matches, NOT to explicit courses)
      exclude: [course_ref | pattern] # Courses/patterns to exclude from pattern matches

      # ----- Grouped Selection (alternative to A/B/C) -----

      # Option D: Grouped selection (pick from N groups)
      groups:
        - id: string
          name: string | null
          courses: [course_ref]
      groups_required: integer | null # How many groups to select (null = all)
      per_group: integer              # Courses to take per selected group

    # Selection quantity (exactly one of these, or credit_range)
    count: integer | null             # Number of courses to select
    credits: integer | null           # Credit total to reach
    credit_range:                     # Variable credit requirement
      min: integer
      max: integer

    # Constraints on selection
    constraints:
      exclude_used: boolean           # Exclude courses used in prior requirements
      distinct_subjects: boolean      # Selections must be from different subjects
      min_upper_division: integer     # Minimum courses/credits at 300+ level
      max_from_subject: integer       # Maximum credits from any single subject
      max_from_pattern: string        # Pattern to limit, e.g., "ICS:400+"
      max_from_pattern_credits: integer # Credit limit for that pattern
      grade_minimum: string           # Override degree-level grade requirement

    # External requirements (for minor/second major options)
    external_requirement: boolean     # If true, credits come from outside defined courses
    external_credits: integer | null  # How many external credits required
    external_note: string | null      # Description of external requirement

    # -------------------------------------------------------------------------
    # For type: one_of - Mutually exclusive paths
    # -------------------------------------------------------------------------
    options:
      - id: string                    # Unique identifier for this path
        name: string                  # Path name (e.g., "Data Science Track")
        requirements:                 # Nested requirements for this path
          - name: string | null
            type: all | select
            courses: [course_ref]     # For type: all
            from: object              # For type: select (same structure as above)
            count: integer | null
            credits: integer | null
            credit_range: object | null
            constraints: object | null
            external_requirement: boolean | null
            external_credits: integer | null

# =============================================================================
# FROM BLOCK: COMBINING COURSES AND PATTERNS (NEW in v5.2)
# =============================================================================
#
# The `from` block now supports combining explicit courses with patterns.
# This is useful when a requirement allows:
#   - Specific courses from outside the pattern (e.g., BZ 350, MGT 340)
#   - PLUS any course matching a pattern (e.g., CS 300-479)
#
# POOL CALCULATION:
#   pool = explicit_courses + pattern_matches - exclusions
#
# Where:
#   - explicit_courses: All courses listed in `courses` array
#   - pattern_matches: All courses matching `pattern` or any pattern in `include`
#   - exclusions: Courses/patterns in `exclude` (applied to pattern matches only)
#
# IMPORTANT: `exclude` does NOT remove explicit courses from the pool.
# If a course is explicitly listed in `courses`, it's always included.
#
# EXAMPLES:
#
# Example 1: Specific courses + one pattern
# -----------------------------------------
# Technology electives: BZ 350, CIS 320, plus any CS 300-479
#
#   from:
#     courses:
#       - BZ350
#       - CIS320
#       - MGT340
#     pattern: "CS:300-479"
#     exclude: ["CS:380-399"]  # Excludes CS 380-399 from pattern, not BZ350/etc.
#   credits: 6
#
# Example 2: Multiple patterns with specific courses
# --------------------------------------------------
# Electives from CS, MATH, or STAT upper-division, plus specific approved courses
#
#   from:
#     courses:
#       - ECE452
#       - PHIL410
#       - PSY452
#     include:
#       - "CS:300-479"
#       - "MATH:300-479"
#       - "STAT:300-479"
#     exclude:
#       - CS314          # Already required elsewhere
#       - MATH369        # Already required elsewhere
#       - "CS:380-399"   # Exclude seminar range
#   credits: 9
#
# Example 3: Pattern only (unchanged from v5.1)
# ---------------------------------------------
#   from:
#     pattern: "CS:400+"
#     exclude: [CS499]
#   count: 3
#
# Example 4: Courses only (unchanged from v5.1)
# ---------------------------------------------
#   from:
#     courses: [MATH241, MATH242, MATH243]
#   count: 2
#
# =============================================================================

# =============================================================================
# COURSE REFERENCE SYNTAX
# =============================================================================
#
# course_ref supports multiple formats:
#
# 1. Single course:
#    "CS314"
#
# 2. Course range pattern:
#    "CS:300+"      - CS courses numbered 300 and above
#    "CS:300-399"   - CS courses numbered 300-399
#    "CS:*"         - Any CS course
#    "*:300+"       - Any subject, 300-level and above
#
# 3. Bundle (must take all together, typically lecture + lab):
#    "[CHEM111, CHEM112]"
#    "[PHYS1151, PHYS1152, PHYS1153]"  # Lecture + Lab + Recitation
#
# 4. Choice (pick one, interchangeable):
#    "{CS250, CS270}"
#    Any one of these courses satisfies the requirement
#
# 5. Combination:
#    "{[CHEM111, CHEM112], [CHEM107, CHEM108]}"
#    Pick one bundle from the options
#
# 6. Exclusion in patterns (used in 'from.exclude'):
#    "CS:480-499"   - Exclude CS courses 480-499
#    ["CS5010", "CY4930"]  - Exclude specific courses
#
# =============================================================================

# =============================================================================
# COURSES
# =============================================================================
#
# Minimal course data needed for plan generation.
# Extended metadata (descriptions, tags, etc.) belongs in a separate catalog.
#
# =============================================================================

courses:
  COURSE_ID:                          # e.g., "CS314"
    subject: string                   # e.g., "CS"
    number: string                    # e.g., "314" (string to preserve leading zeros)
    title: string
    credits: integer

    # Variable credits (for courses with credit ranges)
    credit_range:                     # Use instead of credits if variable
      min: integer
      max: integer

    # Scheduling
    prerequisites: "prereq_expr | null" # Boolean expression (see syntax below)
    corequisites: "[string] | null"     # Courses that must be taken concurrently
    typically_offered: "[string] | null" # ["fall", "spring", "summer"]

    # Grade requirements
    grade_minimum: "string | null"      # Override if stricter than degree default
                                      # Use for enrollment requirements, not prereqs
                                      # (prereq grades go in prerequisite expression)

    # Cross-listing (equivalent courses in different departments)
    cross_listed_as: "[string] | null"  # e.g., ["PHIL201"] for CS201
                                      # Only one needs to be taken; they're equivalent

    # Repeatability (for research, directed study, special topics)
    repeatable: boolean               # Can this course be taken multiple times?
    max_repeat_credits: "integer | null" # Maximum total credits from repeating

    # General education attributes
    gen_ed_attributes: "[string] | null" # e.g., ["GT-SC1", "AUCC-3A", "NUpath-ND"]
                                       # Institution-specific gen-ed codes

# =============================================================================
# PREREQUISITE EXPRESSION SYNTAX
# =============================================================================
#
# Prerequisites are boolean expressions that can be evaluated programmatically.
#
# Operators:
#   &   AND (both required)
#   |   OR (either satisfies)
#   ()  Grouping
#   []  Grade requirement suffix
#
# Examples:
#   "CS165"                           # Single prerequisite
#   "CS165 & CS220"                   # Both required
#   "CS250 | CS270"                   # Either satisfies
#   "(CS165 & CS220) | MATH301"       # Complex expression
#   "ICS111[B] & ICS211[B]"           # Requires grade B or better
#   "MATH241[B]"                      # Requires B in MATH241
#   null                              # No prerequisites
#
# Grade Requirements:
#   - Use [GRADE] suffix in prerequisites for prerequisite grade requirements
#   - Use course.grade_minimum for the grade required IN THIS COURSE
#   - Common grades: A, A-, B+, B, B-, C+, C, C-, D+, D, D-, F
#   - "B" means "B or better" (B, B+, A-, A)
#
# Grammar (informal):
#   expr       := term (('&' | '|') term)*
#   term       := course_req | '(' expr ')'
#   course_req := COURSE_ID ('[' GRADE ']')?
#
# Notes:
#   - Operator tokens are `&` and `|` only (no `AND`/`OR` keyword forms).
#   - Parens nest arbitrarily: "((A & B) | (C & D))" is valid.
#   - The expression accepts COURSE_IDs only — pattern syntax like "CS:300+"
#     belongs in `from` blocks (selection pools), not in prerequisite
#     expressions, which must enumerate individual courses.
#   - Whitespace around operators is optional but recommended for readability.
#
# =============================================================================

# =============================================================================
# GENERAL EDUCATION / UNIVERSITY REQUIREMENTS
# =============================================================================
#
# University-wide requirements can be represented as regular requirements
# with category: gen_ed. Use gen_ed_attributes on courses to map them
# to institution-specific requirement codes.
#
# Common patterns:
#
# 1. Simple category requirement:
#    gen_ed_writing:
#      name: "First-Year Writing"
#      type: select
#      category: gen_ed
#      from:
#        courses: [ENGW1111, ENGL1010]
#      count: 1
#
# 2. Attribute-based requirement (courses tagged with gen-ed codes):
#    gen_ed_natural_science:
#      name: "Natural Science (AUCC 3A)"
#      type: select
#      category: gen_ed
#      from:
#        # Courses with gen_ed_attributes containing "AUCC-3A"
#        attribute: "AUCC-3A"
#      credits: 7
#
# 3. Distribution requirement:
#    gen_ed_distribution:
#      name: "Arts & Humanities Distribution"
#      type: select
#      category: gen_ed
#      from:
#        groups:
#          - id: arts
#            name: "Arts"
#            attribute: "GE-ART"
#          - id: humanities
#            name: "Humanities"
#            attribute: "GE-HUM"
#        groups_required: 2
#        per_group: 1
#
# =============================================================================

