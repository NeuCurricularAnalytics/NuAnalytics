# MIGRATION FROM v5.0
# =============================================================================
#
# | v5.0 Construct           | v5.2 Equivalent                           |
# |--------------------------|-------------------------------------------|
# | (same as v5.1)           | (compatible - v5.0 files work in v5.2)    |
#
# =============================================================================

# =============================================================================
# MIGRATION FROM v4.4
# =============================================================================
#
# | v4.4 Construct           | v5.2 Equivalent                           |
# |--------------------------|-------------------------------------------|
# | type: required           | type: all                                 |
# | type: pick               | type: select, from.courses                |
# | type: pool               | type: select, from.pattern                |
# | type: pick_group         | type: one_of                              |
# | type: pick_n_groups      | type: select, from.groups                 |
# | type: pick_requirement   | type: one_of (nested requirements)        |
# | type: pick_path          | type: one_of                              |
# | course_bundles section   | Inline [A, B] syntax                      |
# | equivalent_to            | Inline {A, B} syntax + cross_listed_as    |
# | substitutions section    | type: one_of with path options            |
# | prerequisites (list)     | prerequisites (expression)                |
# | prerequisites_note       | Removed (expression is self-documenting)  |
# | university_requirements  | Regular requirements with category: gen_ed|
# | experiential section     | Regular requirements                      |
# | notes                    | Removed (use external documentation)      |
# | requires_approval        | Removed                                   |
# | overlap_policy           | degree.allow_double_counting              |
#
# =============================================================================

# =============================================================================
# BEST PRACTICES
# =============================================================================
#
# 1. Grade Requirements:
#    - Use prerequisite expression [GRADE] for "must have earned X in prereq"
#    - Use course.grade_minimum for "must earn X in this course"
#    - Use requirement.constraints.grade_minimum for "all courses in this
#      requirement need grade X"
#
# 2. Cross-listed Courses:
#    - Define both courses with cross_listed_as pointing to each other
#    - In requirements, use {A, B} syntax or just list one
#    - Validation should warn if both appear in same requirement
#
# 3. Variable Credits:
#    - Use credit_range for research, independent study, internship
#    - When calculating totals, use min value for minimum credits
#
# 4. Gen-Ed Mapping:
#    - Use gen_ed_attributes to tag courses with institution codes
#    - Create gen_ed requirements that filter by attribute
#    - This enables "take any course with attribute X" requirements
#
# 5. External Requirements:
#    - Use for minors, second majors, or requirements outside your data
#    - Set external_requirement: true and external_credits
#    - Planner software should prompt user to specify these
#
# 6. Pattern Exclusions:
#    - List specific courses: exclude: [CS5010, CY4930]
#    - Use ranges: exclude: ["CS:480-499"]
#    - Combine both: exclude: [CS5010, "CS:480-499"]
#
# 7. Combined Courses + Patterns (NEW in v5.2):
#    - Use when requirement allows specific courses PLUS a range
#    - Explicit courses are always included (exclude doesn't affect them)
#    - Use `include` array for multiple patterns
#    - Document the catalog source in comments
#
# =============================================================================
