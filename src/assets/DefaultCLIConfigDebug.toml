# NuAnalytics — Default configuration (debug builds)
# Used when running from source with `cargo run` or a debug binary.
# Output files go under .debug/ in the working directory to keep them
# separate from release output and avoid cluttering the project root.
# Override any value in ~/.config/nuanalytics/dconfig.toml or ./nuanalytics.toml

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[logging]
# Debug builds log everything by default
level = "debug"

# Local log file — stays inside the project directory
file = ".debug/nuanalytics.debug.log"

# Verbose output on by default for development
verbose = true

# ---------------------------------------------------------------------------
# Database (Supabase)
# ---------------------------------------------------------------------------
# SECURITY: `endpoint` and `anon_key` ship BLANK and must stay that way.
# This file is compiled in with include_str! and tracked in a PUBLIC repo, so any
# value here is published. It is not merely cosmetic either: merge_defaults()
# refills an EMPTY endpoint/anon_key from these defaults and load_home_config()
# then SAVES the result -- so a non-blank value here silently re-points a
# self-hosted user back at that backend and persists it. `config unset
# database.endpoint` has the same effect.
#
# Each deployment configures its own backend:
#   nuanalytics config set database.endpoint <url>
#   nuanalytics config set database.anon_key  <key>
#
# Left blank, the tool reports "Database not configured. Set `endpoint` and
# `anon_key` in [database] config." -- the correct outcome, since every feature
# except the database ones works with no backend at all.
[database]
# Supabase project URL
endpoint = ""

# Supabase anonymous (public) key — identifies the project on every
# request and bootstraps the OAuth login flow. Does not authorise access
# on its own; run `nuanalytics db login` once to obtain a user session.
anon_key = ""

# Enable database features (MCP database tools, IPEDS import, db login)
enabled = true

# Debug session is stored locally — separate from any active release session
auth_file = ".debug/dauth.json"

# Supabase Personal Access Token for exec-sql (DDL operations).
# Generate at: https://app.supabase.com/account/tokens
management_key = ""

# ---------------------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------------------
[paths]
# Keep debug output inside .debug/ so it doesn't mix with real data
metrics_dir = ".debug/metrics"
reports_dir = ".debug/reports"

# ---------------------------------------------------------------------------
# Audit settings
# ---------------------------------------------------------------------------
[audit]
# Flag prerequisite chains at or longer than this depth
prerequisite_chain_threshold = 4

# ---------------------------------------------------------------------------
# Degree analysis
# ---------------------------------------------------------------------------
[degree_analysis]
# Aggregate metric strategy across generated plans: median | mean
calc_strategy = "median"

# Plans to export in full. Smaller value speeds up debug iteration.
sample_plan_count = 3

# Lower cap for debug — catches runaway generation faster during development
max_plans = 1000

# Skip duplicate plan permutations
ignore_duplicates = true

# Plan enumeration order before sampling:
#   sequential | shuffled | stratified
sampling_strategy = "shuffled"
