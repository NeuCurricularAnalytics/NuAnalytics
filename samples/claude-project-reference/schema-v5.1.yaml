# =============================================================================
# VALIDATION RULES
# =============================================================================
#
# A valid v5.1 file must satisfy:
#
# 1. Referential integrity:
#    - All courses referenced in requirements exist in `courses` section
#    - All courses in bundles exist
#    - All courses in choice sets exist
#    - All prerequisites reference existing courses
#    - Cross-listed courses reference each other bidirectionally
#
# 2. Type consistency:
#    - type: all → must have `courses`
#    - type: select → must have `from` and (`count` or `credits` or `credit_range`)
#    - type: one_of → must have `options`
#    - external_requirement: true → should have `external_credits`
#
# 3. Nested requirements in one_of:
#    - Cannot have nested one_of (max depth = 1)
#    - Nested requirements can only be `all` or `select`
#
# 4. Pattern syntax:
#    - Patterns must match: SUBJECT:(NUMBER+ | NUMBER-NUMBER | *)
#    - Wildcard subject: *:(NUMBER+ | NUMBER-NUMBER)
#    - Bundles: [COURSE, COURSE, ...]
#    - Choices: {COURSE, COURSE, ...}
#
# 5. Prerequisite expressions:
#    - Must be valid boolean expressions
#    - All referenced courses must exist
#    - Grade requirements must be valid grades (A through F, with +/-)
#
# 6. Credit consistency:
#    - Course must have either `credits` or `credit_range`, not both
#    - Requirement must have one of: `count`, `credits`, `credit_range`
#    - `max_repeat_credits` only valid when `repeatable: true`
#
# 7. Cross-listing consistency:
#    - If A lists B in cross_listed_as, B should list A
#    - Cross-listed courses should have same credits
#    - Only one cross-listed course should appear in requirements
#
# =============================================================================

