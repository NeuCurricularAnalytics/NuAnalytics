# =============================================================================
# Colorado State University - Major in Computer Science (CS Concentration)
# Schema v5.1 | Catalog 2025-2026
# =============================================================================

degree:
  id: csu-cs-bscs-general
  institution: Colorado State University
  program: Bachelor of Science in Computer Science - Computer Science Concentration
  catalog_year: "2025-2026"
  source_url: https://catalog.colostate.edu/general-catalog/colleges/natural-sciences/computer-science/computer-science-major/computer-science-concentration/
  total_credits: 120
  upper_division_credits: 42
  in_major_credits: null
  gpa_minimum: 2.0
  gpa_major: 2.0
  grade_minimum: "C"
  grade_minimum_note: "A minimum grade of C (2.000) is required in CO 150 and in all CS, DSCI, MATH, STAT and departmental Technology Focus Elective courses"
  major_subjects: [CS, CT, DSCI]
  allow_double_counting: false

# =============================================================================
# REQUIREMENTS
# =============================================================================

requirements:

  # ---------------------------------------------------------------------------
  # Freshman Year
  # ---------------------------------------------------------------------------
  composition:
    name: College Composition
    type: all
    category: gen_ed
    courses:
      - CO150
    constraints:
      grade_minimum: "C"

  ethics:
    name: Ethical Computing Systems
    type: all
    category: major
    courses:
      - "{CS201, PHIL201}"
    constraints:
      grade_minimum: "C"

  calculus:
    name: Mathematics for Computational Science I
    type: select
    category: supporting
    from:
      courses:
        - MATH156  # Mathematics for Computational Science I
        - MATH160  # Calculus for Physical Scientists I
    count: 1
    constraints:
      grade_minimum: "C"

  intro_programming:
    name: Introduction to Programming Sequence
    type: one_of
    category: major
    options:
      - id: group_a
        name: "Group A: Culture and Coding Path"
        requirements:
          - name: Culture and Coding
            type: select
            from:
              courses:
                - CS150A
                - CS150B
            count: 1
          - name: CS1
            type: select
            from:
              courses:
                - CS162
                - CS164
            count: 1
      - id: group_b
        name: "Group B: Python for STEM Path"
        requirements:
          - name: Python for STEM
            type: all
            courses:
              - CS152
          - name: CS1
            type: select
            from:
              courses:
                - CS162
                - CS164
            count: 1
      - id: group_c
        name: "Group C: No Prior Programming"
        requirements:
          - name: CS1 No Prior Experience
            type: all
            courses:
              - CS163

  science_with_lab:
    name: Natural Science with Lab
    type: select
    category: gen_ed
    from:
      courses:
        - "[AA100, AA101]"    # Intro to Astronomy + Lab
        - "[ANTH120, ANTH121]"  # Human Origins + Lab
        - "[BZ110, BZ111]"    # Animal Biology + Lab
        - BZ120              # Plant Biology (has integrated lab)
        - "[CHEM107, CHEM108]"  # Fundamentals of Chemistry + Lab
        - "[CHEM111, CHEM112]"  # General Chemistry I + Lab
        - "[GEOL120, GEOL121]"  # Geology and Society + Lab
        - "[GEOL122, GEOL121]"  # Climate and Environmental Change + Lab
        - "[GEOL124, GEOL121]"  # Earth Resources + Lab
        - GEOL150            # Dynamic Earth
        - HONR292A           # Honors Seminar: Knowing in Sciences
        - LIFE102            # Attributes of Living Systems
        - LIFE103            # Biology of Organisms
        - LIFE201A           # Introductory Genetics: Applied
        - LIFE201B           # Introductory Genetics: Molecular
        - "{LIFE220, LAND220}"  # Fundamentals of Ecology
        - NR150              # Oceanography
        - PH121              # General Physics I
        - PH122              # General Physics II
        - PH141              # Physics for Scientists and Engineers I
        - PH142              # Physics for Scientists and Engineers II
    credits: 7
    constraints:
      min_upper_division: 0

  # ---------------------------------------------------------------------------
  # Sophomore Year
  # ---------------------------------------------------------------------------
  data_structures:
    name: Data Structures
    type: all
    category: major
    courses:
      - CS165
    constraints:
      grade_minimum: "C"

  discrete_structures:
    name: Discrete Structures
    type: all
    category: major
    courses:
      - CS220
    constraints:
      grade_minimum: "C"

  software_development:
    name: Software Development
    type: one_of
    category: major
    options:
      - id: group_a
        name: "Group A: CS 214 + CT 301"
        requirements:
          - type: all
            courses:
              - CS214
              - CT301
      - id: group_b
        name: "Group B: CS 253"
        requirements:
          - type: all
            courses:
              - CS253

  computer_organization:
    name: Computer Systems/Organization
    type: select
    category: major
    from:
      courses:
        - CS250  # Computer Systems Foundations
        - CS270  # Computer Organization
    count: 1
    constraints:
      grade_minimum: "C"

  linear_algebra:
    name: Linear Algebra
    type: select
    category: supporting
    from:
      courses:
        - DSCI369  # Linear Algebra for Data Science
        - MATH369  # Linear Algebra I
    count: 1
    constraints:
      grade_minimum: "C"

  statistics:
    name: Statistics
    type: select
    category: supporting
    from:
      courses:
        - STAT301   # Introduction to Applied Statistical Methods
        - STAT302A  # Statistics Supplement
        - STAT307   # Introduction to Biostatistics
        - STAT315   # Intro to Theory and Practice of Statistics
    count: 1
    constraints:
      grade_minimum: "C"

  # ---------------------------------------------------------------------------
  # Junior Year
  # ---------------------------------------------------------------------------
  software_engineering:
    name: Software Engineering
    type: all
    category: major
    courses:
      - CS314
    constraints:
      grade_minimum: "C"

  algorithms:
    name: Algorithms
    type: all
    category: major
    courses:
      - CS320
    constraints:
      grade_minimum: "C"

  operating_systems:
    name: Operating Systems
    type: all
    category: major
    courses:
      - CS370
    constraints:
      grade_minimum: "C"

  junior_cs_electives:
    name: Junior CS Electives (300-level)
    type: select
    category: major
    from:
      pattern: "CS:300+"
      exclude:
        - "CS:380-399"
        - "CS:480-499"
    count: 2
    constraints:
      grade_minimum: "C"
      exclude_used: true

  # ---------------------------------------------------------------------------
  # Senior Year - Capstone
  # ---------------------------------------------------------------------------
  capstone:
    name: Capstone Course
    type: select
    category: major
    from:
      courses:
        - CS410   # Introduction to Computer Graphics
        - CS414   # Object-Oriented Design
        - CS420   # Introduction to Analysis of Algorithms
        - CS425   # Introduction to Bioinformatics Algorithms
        - CS430   # Database Systems
        - CS435   # Introduction to Big Data
        - CS440   # Introduction to Artificial Intelligence
        - CS445   # Introduction to Machine Learning
        - CS453   # Introduction to Compiler Construction
        - CS454   # Principles of Programming Languages
        - CS455   # Introduction to Distributed Systems
        - CS456   # Modern CyberSecurity
        - CS457   # Computer Networks and the Internet
        - CS458   # Blockchain Principles and Applications
        - CS462   # Engaging in Virtual Worlds
        - CS464   # Principles of Human-Computer Interaction
        - CS465   # Multimodal Interaction for 3D User Interfaces
        - CS470   # Computer Architecture
        - CS475   # Parallel Programming
    count: 1
    constraints:
      grade_minimum: "C"

  senior_cs_electives:
    name: Senior CS Electives (400-level)
    type: select
    category: major
    from:
      pattern: "CS:400+"
      exclude:
        - "CS:480-499"
    count: 2
    constraints:
      grade_minimum: "C"
      exclude_used: true

  # ---------------------------------------------------------------------------
  # Technology Focus OR Minor/Second Major (Choose One)
  # ---------------------------------------------------------------------------
  tech_focus_or_minor:
    name: Technology Focus or Minor/Second Major
    type: one_of
    category: major
    options:
      - id: tech_focus
        name: "Group A: Technology Focus"
        requirements:
          - name: Technology Focus Electives
            type: select
            from:
              courses:
                - BZ350   # Molecular and General Genetics
                - BZ360   # Bioinformatics and Genomics
                - CIS320  # Project Management for Information Systems
                - DSCI235 # Data Wrangling
                - ECE452  # Computer Organization and Architecture
                - ENGR422 # Technology Entrepreneurship
                - JTC372  # Web Design and Development
                - JTC472  # Advanced Web Design and Development
                - MATH161 # Calculus for Physical Scientists II
                - MATH256 # Mathematics for Computational Science II
                - MGT330  # Creativity, Innovation, and Value Creation
                - MGT340  # Fundamentals of Entrepreneurship
                - MGT420  # New Venture Creation
                - PHIL410 # Gödel's Incompleteness Theorems
                - PHIL411 # Logic in Philosophy and Beyond
                - PHIL415 # Logic and Scientific Method
                - PSY252  # Mind, Brain, and Behavior
                - PSY352  # Learning and Memory
                - PSY452  # Cognitive Psychology
                - PSY454  # Biological Psychology
                - PSY456  # Sensation and Perception
                - PSY458  # Cognitive Neuroscience
            credits: 6
            constraints:
              min_upper_division: 3
              grade_minimum: "C"
          - name: Additional 400-level CS Course
            type: select
            from:
              pattern: "CS:400+"
              exclude:
                - "CS:480-499"
            count: 1
            constraints:
              exclude_used: true
              grade_minimum: "C"

      - id: minor_second_major
        name: "Group B: Minor or Second Major"
        requirements:
          - name: Minor/Second Major Credits
            type: select
            external_requirement: true
            external_credits: 21
            external_note: "Complete a minor or second major (21 credits, none from CS)"

  # ---------------------------------------------------------------------------
  # AUCC (All-University Core Curriculum) Requirements
  # ---------------------------------------------------------------------------
  aucc_1c:
    name: AUCC 1C Requirement
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3

  aucc_historical:
    name: Historical Perspectives (3D)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3

  aucc_social_behavioral:
    name: Social and Behavioral Sciences (3C)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3

  advanced_writing:
    name: Advanced Writing (AUCC 2)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3

  # ---------------------------------------------------------------------------
  # General Electives
  # ---------------------------------------------------------------------------
  general_electives:
    name: General Electives
    type: select
    category: elective
    from:
      pattern: "*:*"
    credits: 8

