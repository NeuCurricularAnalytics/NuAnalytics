degree:
  id: csu-cs-bscs-general
  institution: Colorado State University
  program: Bachelor of Science in Computer Science - Computer Science Concentration
  catalog_year: "2025-2026"
  source_url: https://catalog.colostate.edu/general-catalog/colleges/natural-sciences/computer-science/computer-science-major/computer-science-concentration/
  total_credits: 120
  upper_division_credits: 42
  in_major_credits: null
  gpa_minimum: 2.0
  gpa_major: null
  grade_minimum: "C"
  grade_minimum_note: "C (2.000) required in CO 150 and all CS, DSCI, MATH, STAT and departmental Technology Focus Elective courses"
  major_subjects: [CS, CT, DSCI]
  allow_double_counting: false

# =============================================================================
# REQUIREMENTS
# =============================================================================

requirements:

  # ---------------------------------------------------------------------------
  # AUCC 1A - College Composition
  # ---------------------------------------------------------------------------
  writing_composition:
    name: College Composition (AUCC 1A)
    type: all
    category: gen_ed
    courses:
      - CO150

  # ---------------------------------------------------------------------------
  # AUCC 1B - Mathematics
  # ---------------------------------------------------------------------------
  math_calculus:
    name: Mathematics/Calculus (AUCC 1B)
    type: select
    category: supporting
    from:
      courses:
        - MATH156
        - MATH160
    count: 1

  # ---------------------------------------------------------------------------
  # AUCC 1C - Citizenship (3 credits)
  # ---------------------------------------------------------------------------
  aucc_citizenship:
    name: Citizenship (AUCC 1C)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3
    constraints:
      # Must fulfill AUCC 1C attribute - not modeled in detail

  # ---------------------------------------------------------------------------
  # AUCC 2 - Advanced Writing
  # ---------------------------------------------------------------------------
  advanced_writing:
    name: Advanced Writing (AUCC 2)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3
    constraints:
      # Must fulfill AUCC 2 attribute - specific course list varies

  # ---------------------------------------------------------------------------
  # AUCC 3A - Natural Sciences with Lab (minimum 7 credits)
  # ---------------------------------------------------------------------------
  natural_sciences:
    name: Natural Sciences with Lab (AUCC 3A)
    type: select
    category: gen_ed
    from:
      courses:
        - "[AA100, AA101]"
        - "[ANTH120, ANTH121]"
        - "[BZ110, BZ111]"
        - BZ120
        - "[CHEM107, CHEM108]"
        - "[CHEM111, CHEM112]"
        - "[GEOL120, GEOL121]"
        - "[GEOL122, GEOL121]"
        - "[GEOL124, GEOL121]"
        - GEOL150
        - HONR292A
        - LIFE102
        - LIFE103
        - LIFE201A
        - LIFE201B
        - LIFE220
        - NR150
        - PH121
        - PH122
        - PH141
        - PH142
    credits: 7
    constraints:
      # One course must include the sequenced laboratory

  # ---------------------------------------------------------------------------
  # AUCC 3B - Arts and Humanities (Ethics in CS satisfies one)
  # ---------------------------------------------------------------------------
  ethics_computing:
    name: Ethical Computing Systems (AUCC 3B)
    type: all
    category: major
    courses:
      - "{CS201, PHIL201}"

  # ---------------------------------------------------------------------------
  # AUCC 3B - Additional Arts and Humanities (from intro sequence groups)
  # ---------------------------------------------------------------------------
  # Note: If Group A or C is chosen, an additional 3B course is included
  # This is handled within intro_programming_sequence

  # ---------------------------------------------------------------------------
  # AUCC 3C - Social and Behavioral Sciences
  # ---------------------------------------------------------------------------
  social_behavioral:
    name: Social and Behavioral Sciences (AUCC 3C)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3
    constraints:
      # Must fulfill AUCC 3C attribute

  # ---------------------------------------------------------------------------
  # AUCC 3D - Historical Perspectives
  # ---------------------------------------------------------------------------
  historical_perspectives:
    name: Historical Perspectives (AUCC 3D)
    type: select
    category: gen_ed
    from:
      pattern: "*:*"
    credits: 3
    constraints:
      # Must fulfill AUCC 3D attribute

  # ---------------------------------------------------------------------------
  # Introductory Programming Sequence
  # Select one group from A, B, or C
  # ---------------------------------------------------------------------------
  intro_programming_sequence:
    name: Introductory Programming Sequence
    type: one_of
    category: major
    options:
      - id: group_a
        name: "Group A: Culture and Coding + CS1"
        requirements:
          - name: Culture and Coding Course
            type: select
            from:
              courses:
                - CS150A
                - CS150B
            count: 1
          - name: CS1 Course
            type: select
            from:
              courses:
                - CS162
                - CS164
            count: 1
      - id: group_b
        name: "Group B: Python for STEM + CS1"
        requirements:
          - name: Python for STEM
            type: all
            courses:
              - CS152
          - name: CS1 Course
            type: select
            from:
              courses:
                - CS162
                - CS164
            count: 1
          - name: Additional Arts and Humanities (AUCC 3B)
            type: select
            from:
              pattern: "*:*"
            credits: 3
      - id: group_c
        name: "Group C: CS1 No Prior Experience"
        requirements:
          - name: CS1 Course
            type: all
            courses:
              - CS163
          - name: Additional Arts and Humanities (AUCC 3B)
            type: select
            from:
              pattern: "*:*"
            credits: 3

  # ---------------------------------------------------------------------------
  # CS2 - Data Structures
  # ---------------------------------------------------------------------------
  data_structures:
    name: CS2 - Data Structures
    type: all
    category: major
    courses:
      - CS165

  # ---------------------------------------------------------------------------
  # Discrete Mathematics
  # ---------------------------------------------------------------------------
  discrete_math:
    name: Discrete Structures and Applications
    type: all
    category: major
    courses:
      - CS220

  # ---------------------------------------------------------------------------
  # Software Development - Select Group A or B
  # ---------------------------------------------------------------------------
  software_development:
    name: Software Development
    type: one_of
    category: major
    options:
      - id: group_a
        name: "Group A: CS 214 + CT 301"
        requirements:
          - type: all
            courses:
              - CS214
              - CT301
      - id: group_b
        name: "Group B: CS 253"
        requirements:
          - type: all
            courses:
              - CS253

  # ---------------------------------------------------------------------------
  # Computer Systems - Select one
  # ---------------------------------------------------------------------------
  computer_systems:
    name: Computer Systems
    type: select
    category: major
    from:
      courses:
        - CS250
        - CS270
    count: 1

  # ---------------------------------------------------------------------------
  # Linear Algebra - Select one
  # ---------------------------------------------------------------------------
  linear_algebra:
    name: Linear Algebra
    type: select
    category: supporting
    from:
      courses:
        - DSCI369
        - MATH369
    count: 1

  # ---------------------------------------------------------------------------
  # Statistics - Select one
  # ---------------------------------------------------------------------------
  statistics:
    name: Statistics
    type: select
    category: supporting
    from:
      courses:
        - STAT301
        - STAT302A
        - STAT307
        - STAT315
    count: 1

  # ---------------------------------------------------------------------------
  # Core CS Courses
  # ---------------------------------------------------------------------------
  core_cs:
    name: Core Computer Science
    type: all
    category: major
    courses:
      - CS314
      - CS320
      - CS370

  # ---------------------------------------------------------------------------
  # 300-Level CS Electives (2 courses)
  # ---------------------------------------------------------------------------
  cs_300_electives:
    name: CS 300-Level Electives
    type: select
    category: major
    from:
      pattern: "CS:300-379"
      exclude: ["CS:380-399"]
    count: 2
    constraints:
      exclude_used: true

  # ---------------------------------------------------------------------------
  # Capstone Course - Select one
  # ---------------------------------------------------------------------------
  capstone:
    name: Capstone Course (AUCC 4C)
    type: select
    category: major
    from:
      courses:
        - CS410
        - CS414
        - CS420
        - CS425
        - CS430
        - CS435
        - CS440
        - CS445
        - CS453
        - CS454
        - CS455
        - CS456
        - CS457
        - CS458
        - CS462
        - CS464
        - CS465
        - CS470
        - CS475
    count: 1

  # ---------------------------------------------------------------------------
  # 400-Level CS Electives (2 courses)
  # ---------------------------------------------------------------------------
  cs_400_electives:
    name: CS 400-Level Electives
    type: select
    category: major
    from:
      pattern: "CS:400-479"
      exclude: ["CS:480-499"]
    count: 2
    constraints:
      exclude_used: true

  # ---------------------------------------------------------------------------
  # Technology Focus or Minor/Second Major
  # ---------------------------------------------------------------------------
  tech_focus_or_minor:
    name: Technology Focus or Minor/Second Major
    type: one_of
    category: major
    options:
      - id: tech_focus
        name: "Group A: Technology Focus"
        requirements:
          - name: Technology Focus Electives
            type: select
            from:
              # Specific approved courses from various departments
              courses:
                # Biology
                - BZ350
                - BZ360
                # Business Information Systems
                - CIS320
                # Data Science
                - DSCI235
                # Engineering
                - ECE452
                - ENGR422
                # Journalism/Tech Communication
                - JTC372
                - JTC472
                # Mathematics (specific courses)
                - MATH161
                - MATH256
                # Management
                - MGT330
                - MGT340
                - MGT420
                # Philosophy
                - PHIL410
                - PHIL411
                - PHIL415
                # Psychology
                - PSY252
                - PSY352
                - PSY452
                - PSY454
                - PSY456
                - PSY458
              # PLUS any course from these patterns (v5.2 feature)
              include:
                - "CS:300-479"
                - "CT:300-479"
                - "DSCI:300-479"
                - "MATH:300-479"
                - "STAT:300-479"
                - "IDEA:300-479"
              # Exclude courses required elsewhere or special topics
              exclude:
                - CT301           # Required in software development
                - DSCI369         # Required in linear algebra
                - MATH369         # Required in linear algebra
                - STAT301         # Statistics requirement
                - STAT302A        # Statistics requirement
                - STAT307         # Statistics requirement
                - STAT315         # Statistics requirement
                - "CS:380-399"    # Seminar/special topics range
                - "CS:480-499"    # Capstone/thesis range
            credits: 6
            constraints:
              exclude_used: true
              min_upper_division: 1
          - name: Additional CS 400-Level
            type: select
            from:
              pattern: "CS:400-479"
              exclude: ["CS:480-499"]
            count: 1
            constraints:
              exclude_used: true
      - id: minor_second_major
        name: "Group B: Minor or Second Major"
        requirements:
          - name: Minor or Second Major Credits
            type: select
            external_requirement: true
            external_credits: 21
            external_note: "Complete a minor or second major. Of the 21 credits, none may be from CS."

  # ---------------------------------------------------------------------------
  # Free Electives
  # ---------------------------------------------------------------------------
  free_electives:
    name: Free Electives
    type: select
    category: elective
    from:
      pattern: "*:*"
    credits: 8
    constraints:
      # Fills remaining credits to reach 120

