# =============================================================================
# University of Hawaii at Manoa - Bachelor of Science in Computer Science (General)
# Schema v5.1 | Catalog 2024-2025
# =============================================================================

degree:
  id: uhm-ics-bscs-general
  institution: University of Hawaii at Manoa
  program: Bachelor of Science in Computer Science - General Track
  catalog_year: "2024-2025"
  source_url: https://www.ics.hawaii.edu/academics/undergraduate-programs/bs/
  total_credits: 120
  upper_division_credits: null
  in_major_credits: 57
  gpa_minimum: 2.0
  gpa_major: null
  grade_minimum: "C"
  grade_minimum_note: "C means C, not C-. B (not B-) required in ICS 111 and ICS 211."
  major_subjects: [ICS]
  allow_double_counting: false

# =============================================================================
# REQUIREMENTS
# =============================================================================

requirements:

  # ---------------------------------------------------------------------------
  # Supporting Math Requirements (Required for all BA and BS degrees)
  # ---------------------------------------------------------------------------
  calculus_sequence:
    name: Calculus Sequence
    type: all
    category: supporting
    courses:
      - "{MATH215, MATH241, MATH251A}"  # Calculus I - pick one
      - "{MATH216, MATH242, MATH252A}"  # Calculus II - pick one

  # ---------------------------------------------------------------------------
  # Math/Statistics Requirement
  # ---------------------------------------------------------------------------
  math_statistics:
    name: Math/Statistics Requirement
    type: select
    category: supporting
    from:
      courses:
        - MATH307  # Linear Algebra
        - MATH372  # Elementary Probability and Statistics
    count: 1

  # ---------------------------------------------------------------------------
  # ICS Core Courses
  # ---------------------------------------------------------------------------
  ics_intro:
    name: Introduction to Computer Science I
    type: all
    category: major
    courses:
      - ICS111
    constraints:
      grade_minimum: "B"

  ics_intro_2:
    name: Introduction to Computer Science II
    type: all
    category: major
    courses:
      - ICS211
    constraints:
      grade_minimum: "B"

  discrete_math:
    name: Discrete Mathematics Sequence
    type: one_of
    category: major
    options:
      - id: ics_path
        name: ICS Discrete Math
        requirements:
          - type: all
            courses:
              - ICS141
              - ICS241
      - id: math_substitution
        name: Math Substitution (requires MATH307)
        requirements:
          - type: all
            courses:
              - MATH301  # Introduction to Discrete Mathematics
              - MATH372  # Elementary Probability and Statistics

  program_structure:
    name: Program Structure
    type: select
    category: major
    from:
      courses:
        - ICS212  # Program Structure
        - ICS215  # Introduction to Scripting
    count: 1

  algorithms:
    name: Algorithms
    type: select
    category: major
    from:
      courses:
        - ICS311  # Algorithms
        - ECE367  # Algorithms (substitution allowed)
    count: 1

  software_engineering:
    name: Software Engineering
    type: all
    category: major
    courses:
      - ICS314  # Software Engineering

  database_systems:
    name: Database Systems
    type: all
    category: major
    courses:
      - ICS321  # Database Systems

  operating_systems:
    name: Operating Systems
    type: all
    category: major
    courses:
      - ICS332  # Operating Systems

  security:
    name: Security and Trust I
    type: all
    category: major
    courses:
      - ICS355  # Security and Trust I

  capstone:
    name: Capstone Project
    type: all
    category: major
    courses:
      - ICS496  # Capstone Project

  # ---------------------------------------------------------------------------
  # Breadth Requirements (Two of three pairs)
  # ---------------------------------------------------------------------------
  breadth_requirements:
    name: Breadth Requirements
    type: select
    category: major
    from:
      groups:
        - id: systems_programming
          name: Systems Programming / Logic Design
          courses:
            - ICS312  # Machine-Level and Systems Programming
            - ICS331  # Logic Design and Microprocessors
        - id: languages_ai
          name: Languages / AI
          courses:
            - ICS313  # Programming Language Theory
            - ICS361  # Introduction to AI Programming
        - id: networking
          name: Networking
          courses:
            - ICS351  # Network Design and Management
            - ICS451  # Data Networks
      groups_required: 2
      per_group: 1

  # ---------------------------------------------------------------------------
  # 400-Level Electives
  # ---------------------------------------------------------------------------
  upper_electives:
    name: 400-Level Electives
    type: select
    category: major
    from:
      pattern: "ICS:400+"
    count: 4
    constraints:
      exclude_used: true

