# Northeastern University - Bachelor of Science in Computer Science (Boston)
# Schema v5.1 | Catalog 2025-2026
# =============================================================================
# Source: https://catalog.northeastern.edu/undergraduate/computer-information-science/computer-science/bscs/
# Generated from official catalog. All course numbers verified against 2025-2026 catalog.
# =============================================================================

degree:
  id: neu-khoury-bscs-boston
  institution: Northeastern University
  program: Bachelor of Science in Computer Science (Boston)
  catalog_year: "2025-2026"
  source_url: https://catalog.northeastern.edu/undergraduate/computer-information-science/computer-science/bscs/
  total_credits: 134
  upper_division_credits: null
  in_major_credits: 72
  gpa_minimum: 2.0
  gpa_major: 2.0
  grade_minimum: "D-"
  grade_minimum_note: "Minimum 2.000 cumulative GPA required in all CS, CY, DS, and IS courses"
  major_subjects: [CS, CY, DS, IS]
  allow_double_counting: false

# =============================================================================
# REQUIREMENTS
# =============================================================================

requirements:

  # ---------------------------------------------------------------------------
  # Computer Science Overview (2 credits)
  # ---------------------------------------------------------------------------
  cs_overview:
    name: Computer Science Overview
    type: all
    category: major
    courses:
      - CS1200
      - CS1210

  # ---------------------------------------------------------------------------
  # Computer Science Fundamental Courses (15 credits)
  # Note: Students can take a self-assessment to place out of CS2000/CS2001.
  # Students who place out substitute 4-5 SH of CS, CY, or DS coursework at
  # the 3000 level or higher not otherwise required in the degree.
  # ---------------------------------------------------------------------------
  cs_fundamentals:
    name: Computer Science Fundamental Courses
    type: all
    category: major
    courses:
      - "[CS1800, CS1802]"      # Discrete Structures + Seminar (5 credits)
      - "[CS2000, CS2001]"      # Intro to Program Design + Lab (5 credits)
      - "[CS2100, CS2101]"      # Program Design 1 + Lab (5 credits)

  # ---------------------------------------------------------------------------
  # Computer Science Required Courses (25 credits)
  # ---------------------------------------------------------------------------
  cs_required:
    name: Computer Science Required Courses
    type: all
    category: major
    courses:
      - CS3000                   # Algorithms and Data (4 credits)
      - "[CS3100, CS3101]"       # Program Design 2 + Lab (5 credits)
      - CS3650                   # Computer Systems (4 credits)
      - CS3800                   # Theory of Computation (4 credits)
      - "{CS4530, CS4535}"       # Software Engineering or Capstone (4 credits)
      - DS3000                   # Foundations of Data Science (4 credits)

  # ---------------------------------------------------------------------------
  # Security Required Course (4 credits - pick 1)
  # ---------------------------------------------------------------------------
  security_requirement:
    name: Security Required Course
    type: select
    category: major
    from:
      courses:
        - CY2550                 # Foundations of Cybersecurity
        - CY3740                 # Systems Security
        - CY4740                 # Network Security
    count: 1

  # ---------------------------------------------------------------------------
  # Presentation Requirement (4 credits - pick 1)
  # ---------------------------------------------------------------------------
  presentation_requirement:
    name: Presentation Requirement
    type: select
    category: major
    from:
      courses:
        - COMM1112               # Public Speaking
        - COMM1113               # Business and Professional Speaking
        - COMM1210               # Persuasion and Rhetoric
        - COMM1511               # Communication and Storytelling
        - THTR1125               # Improvisation
        - THTR1130               # Introduction to Acting
        - THTR1180               # Dynamic Presence
        - THTR2345               # Acting for the Camera
    count: 1

  # ---------------------------------------------------------------------------
  # Khoury Approved Electives (8 credits)
  # With advisor approval, directed study, research, project study, and
  # appropriate graduate-level courses may also be taken as upper-division electives.
  # ---------------------------------------------------------------------------
  khoury_electives:
    name: Khoury Approved Electives
    type: select
    category: major
    from:
      pattern: "CS:2500+"
      exclude: [CS5010]
      # Note: Also includes CY 2000+ (except CY4930), DS 2500+ (except DS4900), MKTG4606
      # These patterns would need to be combined in a more complex way
    credits: 8
    constraints:
      exclude_used: true

  # ---------------------------------------------------------------------------
  # Computer Science Concentrations (16 credits - pick 1 concentration)
  # Pick one concentration and complete four courses (16 credits).
  # Up to one Research (CS4991) course can be substituted with college approval.
  # ---------------------------------------------------------------------------
  concentration:
    name: Computer Science Concentration
    type: one_of
    category: major
    options:
      # ----- Artificial Intelligence Concentration -----
      - id: artificial_intelligence
        name: Concentration in Artificial Intelligence
        requirements:
          - name: AI Required Courses
            type: all
            courses:
              - CS4100               # Artificial Intelligence
              - DS4400               # Machine Learning and Data Mining 1
          - name: AI Electives
            type: select
            from:
              courses:
                - CS4120             # Natural Language Processing
                - CS4150             # Game Artificial Intelligence
                - CS4180             # Reinforcement Learning
                - CS4220             # Information Retrieval
                - CS4610             # Robotic Science and Systems
                - CY4100             # AI Security and Privacy
                - DS4420             # Machine Learning and Data Mining 2
                - DS4440             # Practical Neural Networks
            count: 2
            constraints:
              exclude_used: true

      # ----- Foundations Concentration -----
      - id: foundations
        name: Concentration in Foundations
        requirements:
          - name: Foundations Required Courses
            type: select
            from:
              courses:
                - "{CS2800, CS4820}"   # Logic and Computation OR Computer-Aided Reasoning
                - "{CS4805, CS4810}"   # Complexity Theory OR Advanced Algorithms
            count: 2
          - name: Foundations Electives
            type: select
            from:
              courses:
                - "[CS3950, CS4950, CS4950]"  # Research seminar sequence (3 courses)
                - CS4805               # Fundamentals of Complexity Theory
                - CS4810               # Advanced Algorithms
                - CS4820               # Computer-Aided Reasoning
                - CS4830               # System Specification, Verification, and Synthesis
                - CY4770               # Foundations of Cryptography
            count: 2
            constraints:
              exclude_used: true

      # ----- Human-Centered Computing Concentration -----
      - id: human_centered_computing
        name: Concentration in Human-Centered Computing
        requirements:
          - name: HCC Required Courses
            type: all
            courses:
              - CS2484               # Principles of Human-Computer Interaction
              - CS3484               # GUI Programming
          - name: HCC Electives
            type: select
            from:
              courses:
                - CS4097             # Mixed Reality
                - CS4350             # Empirical Research Methods
                - CS4520             # Mobile Application Development
                - CS4550             # Web Development
                - DS4200             # Information Presentation and Visualization
                - HINF5300           # Personal Health Interface Design and Development
            count: 2
            constraints:
              exclude_used: true

      # ----- Software Concentration -----
      - id: software
        name: Concentration in Software
        requirements:
          - name: Software Required Courses
            type: all
            courses:
              - CS2800               # Logic and Computation
              - CS4400               # Programming Languages
              - "{CS4700, CS4730}"   # Network Fundamentals OR Distributed Systems
          - name: Software Electives
            type: select
            from:
              courses:
                - CS3520             # Programming in C++
                - CS4410             # Compilers
                - CS4520             # Mobile Application Development
                - CS4550             # Web Development
                - CS4700             # Network Fundamentals
                - CS4730             # Distributed Systems
                - CS4820             # Computer-Aided Reasoning
                - CS4830             # System Specification, Verification, and Synthesis
            count: 1
            constraints:
              exclude_used: true

      # ----- Systems Concentration -----
      - id: systems
        name: Concentration in Systems
        requirements:
          - name: Systems Required Networks
            type: all
            courses:
              - "{CS4700, CS4730}"   # Network Fundamentals OR Distributed Systems
          - name: Systems Required Security
            type: select
            from:
              courses:
                - CY3740             # Systems Security
                - CY4740             # Network Security
            count: 1
            constraints:
              exclude_used: true
          - name: Systems Electives
            type: select
            from:
              courses:
                - CS3520             # Programming in C++
                - CS4300             # Computer Graphics
                - CS4360             # Non-Interactive Computer Graphics
                - CS4610             # Robotic Science and Systems
                - CS4700             # Network Fundamentals
                - CS4730             # Distributed Systems
                - CY3740             # Systems Security
                - CY4740             # Network Security
                - CY4760             # Security of Wireless and Mobile Systems
            count: 2
            constraints:
              exclude_used: true

  # ---------------------------------------------------------------------------
  # SUPPORTING COURSES
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Mathematics Courses (8 credits)
  # ---------------------------------------------------------------------------
  mathematics:
    name: Mathematics Courses
    type: all
    category: supporting
    courses:
      - MATH1341                  # Calculus 1 for Science and Engineering
      - "{MATH1365, MATH1465}"   # Intro to Mathematical Reasoning OR Intensive

  # ---------------------------------------------------------------------------
  # Computing and Social Issues (4 credits - pick 1)
  # ---------------------------------------------------------------------------
  computing_social_issues:
    name: Computing and Social Issues
    type: select
    category: supporting
    from:
      courses:
        - AFCS2600               # Issues in Race, Science, and Technology
        - CY4170                 # The Law, Ethics, and Policy of Data and Digital Technologies
        - CY5240                 # Cyberlaw: Privacy, Ethics, and Digital Rights
        - "{DS1300, PHIL1300}"   # Knowledge in a Digital World (cross-listed)
        - HIST2220               # History of Technology
        - INSH2102               # Bostonography
        - JRNL3700               # Data Storytelling
        - PHIL1145               # Technology and Human Values
        - SOCL1280               # The Twenty-First-Century Workplace
        - SOCL2485               # Environment, Technology, and Society
        - SOCL4528               # Technology and Society
    count: 1

  # ---------------------------------------------------------------------------
  # Electrical Engineering (5 credits)
  # ---------------------------------------------------------------------------
  electrical_engineering:
    name: Digital Design and Computer Architecture
    type: all
    category: supporting
    courses:
      - "[EECE2310, EECE2311]"   # Digital Design + Lab

  # ---------------------------------------------------------------------------
  # Science Requirement (8 credits - pick 2 courses with labs)
  # Courses may be taken from different categories.
  # ---------------------------------------------------------------------------
  science_requirement:
    name: Science Requirement
    type: select
    category: supporting
    from:
      groups:
        - id: biology
          name: Biology
          courses:
            - "[BIOL1111, BIOL1112]"   # General Biology 1 + Lab
            - "[BIOL1113, BIOL1114]"   # General Biology 2 + Lab
            - "[BIOL2301, BIOL2302]"   # Genetics and Molecular Biology + Lab
        - id: chemistry
          name: Chemistry
          courses:
            - "[CHEM1161, CHEM1162]"   # General Chemistry for Science Majors + Lab
            - "[CHEM1211, CHEM1212, CHEM1213]"  # General Chemistry 1 + Lab + Recitation
            - "[CHEM1214, CHEM1215, CHEM1216]"  # General Chemistry 2 + Lab + Recitation
        - id: geology_environmental
          name: Geology/Environmental Science
          courses:
            - "[ENVR1200, ENVR1201]"   # Dynamic Earth + Lab
            - "[ENVR2310, ENVR2311]"   # Earth Materials + Lab
            - "[ENVR2340, ENVR2341]"   # Earth Landforms and Processes + Lab
            - "[ENVR3300, ENVR3301]"   # Geographic Information Systems + Lab
            - "[ENVR4500, ENVR4501]"   # Applied Hydrogeology + Lab
        - id: mathematics
          name: Mathematics
          courses:
            - MATH1342               # Calculus 2 for Science and Engineering
            - MATH2280               # Statistics and Software
            - MATH2331               # Linear Algebra
            - MATH3081               # Probability and Statistics
        - id: physics
          name: Physics
          courses:
            - "[PHYS1145, PHYS1146]"   # Physics for Life Sciences 1 + Lab
            - "[PHYS1147, PHYS1148]"   # Physics for Life Sciences 2 + Lab
            - "[PHYS1151, PHYS1152, PHYS1153]"  # Physics for Engineering 1 + Lab + Seminar
            - "[PHYS1155, PHYS1156, PHYS1157]"  # Physics for Engineering 2 + Lab + Seminar
            - "[PHYS1161, PHYS1162, PHYS1163]"  # Physics 1 + Lab + Recitation
            - "[PHYS1165, PHYS1166, PHYS1167]"  # Physics 2 + Lab + Recitation
      groups_required: null  # Can mix from any groups
      per_group: null        # No per-group requirement
    count: 2

  # ---------------------------------------------------------------------------
  # WRITING REQUIREMENT
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # College Writing (4 credits)
  # ---------------------------------------------------------------------------
  first_year_writing:
    name: College Writing
    type: all
    category: gen_ed
    courses:
